name: proyecto-qa

services:
  db:
    image: postgres:17-alpine
    environment:
      # Deben coincidir con DB_DATABASE, DB_USERNAME y DB_PASSWORD de backend/.env
      POSTGRES_DB: proyecto_qa
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa_secret
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d proyecto_qa"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  db_data:
  backend_vendor:
  frontend_node_modules:
